<title>にほんご 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one study desk — header with level + progress, tab strip, one working card per tab; Japanese in textbook-style Klee One, Korean UI in Plex Sans KR */
:root {
  --paper: #F4F6F9;
  --surface: #FFFFFF;
  --ink: #1A2333;
  --muted: #5D6879;
  --line: #DCE2EB;
  --ai: #2A4A7C;
  --ai-soft: #E5ECF6;
  --ai-ink: #FFFFFF;
  --gold: #A87A1E;
  --hl: #F6E7BF;
  --ok: #2E7A4D;
  --ok-soft: #E3F2E8;
  --bad: #B0432E;
  --bad-soft: #F8E6E1;
  --grid: #E4D9D2;
  --jp: "Klee One", "Yu Mincho", "Hiragino Mincho ProN", "MS Mincho", serif;
  --ko: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F141C; --surface: #171F2B; --ink: #E5E9F0; --muted: #9AA5B6; --line: #283345;
    --ai: #8DAEE6; --ai-soft: #1D2A40; --ai-ink: #0F141C; --gold: #D8AE58; --hl: #4A3B17;
    --ok: #6CC090; --ok-soft: #173326; --bad: #E78C77; --bad-soft: #3A1E19; --grid: #3A3330;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F141C; --surface: #171F2B; --ink: #E5E9F0; --muted: #9AA5B6; --line: #283345;
  --ai: #8DAEE6; --ai-soft: #1D2A40; --ai-ink: #0F141C; --gold: #D8AE58; --hl: #4A3B17;
  --ok: #6CC090; --ok-soft: #173326; --bad: #E78C77; --bad-soft: #3A1E19; --grid: #3A3330;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--ko); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: flex; flex-direction: column; gap: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
.jp { font-family: var(--jp); }
rt { font-size: .66em; color: var(--muted); font-family: var(--jp); }
ruby { ruby-align: center; }
.nofuri rt { display: none; }
mark { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--jp); font-weight: 600; font-size: 30px; letter-spacing: .02em; line-height: 1.2; }
.brand h1 span { font-family: var(--ko); font-weight: 600; font-size: 22px; color: var(--muted); margin-left: 4px; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; }
.stat { display: flex; flex-direction: column; align-items: flex-start; padding: 6px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-width: 72px; }
.stat b { font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat b small { font-size: 12px; color: var(--muted); font-weight: 500; }
.stat > small { font-size: 11px; color: var(--muted); letter-spacing: .03em; }
.stat.streak b { color: var(--gold); }

.levelbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.lv { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; flex: 1; min-width: 0; }
.lv button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; line-height: 1.25; color: var(--muted); }
.lv button b { font-size: 16px; color: var(--ink); font-variant-numeric: tabular-nums; }
.lv button small { font-size: 11px; }
.lv button[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.lv button[aria-pressed="true"] b { color: var(--gold); }
.label { font-size: 11px; color: var(--muted); letter-spacing: .06em; font-weight: 600; }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
nav.tabs button { border: 0; background: transparent; padding: 8px 4px; border-radius: 9px; display: flex; flex-direction: column; align-items: center; color: var(--muted); }
nav.tabs button .k { font-family: var(--jp); font-size: 18px; line-height: 1.3; }
nav.tabs button .l { font-size: 12px; }
nav.tabs button[aria-selected="true"] { background: var(--ai); color: var(--ai-ink); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel h2 { margin: 0; font-size: 18px; font-weight: 600; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spread { justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ai-soft); color: var(--ai); font-weight: 600; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--ai); color: var(--ai); background: var(--ai-soft); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; font-weight: 500; }
.btn:hover { border-color: var(--ai); }
.btn.primary { background: var(--ai); border-color: var(--ai); color: var(--ai-ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ai); padding-inline: 8px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.big { flex: 1; padding: 14px 16px; font-size: 16px; }
.btn.no { color: var(--bad); } .btn.yes { color: var(--ok); }
.listen { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 34px; height: 34px; display: inline-grid; place-items: center; color: var(--ai); flex: none; padding: 0; }
.listen svg { width: 17px; height: 17px; }
.no-tts .listen { display: none; }
.search { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--paper); color: var(--ink); font: inherit; }
.bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ai); border-radius: 999px; transition: width .3s; }
.meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }

/* cards */
.card { border: 1px solid var(--line); border-radius: 16px; min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 28px 16px 20px; text-align: center; background: var(--paper); cursor: pointer; position: relative; width: 100%; }
.card .yomi { font-family: var(--jp); color: var(--muted); font-size: 24px; line-height: 1.4; }
.qprompt .yomi { font-size: 24px; line-height: 1.4; }
.card .word { font-family: var(--jp); font-size: 46px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.card .kanji { font-family: var(--jp); font-size: 96px; font-weight: 600; line-height: 1.1; }
.card .mean { font-size: 19px; font-weight: 600; max-width: 34ch; }
.card .pos { font-size: 12px; color: var(--muted); }
.card .hint { font-size: 12px; color: var(--muted); }
.card .tag { position: absolute; top: 10px; left: 12px; font-size: 11px; color: var(--muted); }
.card .state { position: absolute; top: 10px; right: 12px; font-size: 11px; font-weight: 600; }
.card .state.k { color: var(--ok); } .card .state.h { color: var(--bad); }
.card.swipe { touch-action: pan-y; user-select: none; -webkit-user-select: none; will-change: transform; }
.card.dragging { transition: none !important; }
.card.settle { transition: transform .2s ease, opacity .2s ease; }
.card.in-l { animation: inL .22s ease; } .card.in-r { animation: inR .22s ease; }
@keyframes inL { from { transform: translateX(40%); opacity: 0; } }
@keyframes inR { from { transform: translateX(-40%); opacity: 0; } }
.btn.navb { padding: 10px 0; width: 48px; flex: none; font-size: 20px; line-height: 1; color: var(--ai); }
.swipehint { font-size: 11px; color: var(--muted); text-align: center; margin-top: -6px; }
.roma { font-family: var(--ko); font-style: italic; font-size: .78em; color: var(--ai); letter-spacing: .02em; margin-left: 6px; white-space: nowrap; }
.roma-line { font-family: var(--ko); font-style: italic; font-size: 15px; color: var(--ai); letter-spacing: .03em; }
.readings dd .roma { font-size: 13px; }
.plan { display: flex; flex-direction: column; gap: 6px; }
.days { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.days button { border: 1px solid var(--line); border-radius: 8px; padding: 5px 0; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted);
  background: linear-gradient(to top, var(--ai-soft) var(--p), var(--surface) var(--p)); min-width: 0; }
.days button.part { color: var(--ai); border-color: var(--ai-soft); }
.days button.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.days button[aria-pressed="true"] { background: var(--ai); border-color: var(--ai); color: var(--ai-ink); font-weight: 600; }
.chk { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 12px; color: var(--muted); flex: none; }
.chk[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; font-weight: 600; font-family: var(--ko); }
.items { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--surface); }
.item:first-child { border-top: 0; }
.item .num { width: 34px; text-align: right; flex: none; }
.item .box { width: 26px; height: 26px; border: 1.5px solid var(--muted); border-radius: 7px; display: grid; place-items: center; flex: none; background: var(--surface); padding: 0; color: var(--ai-ink); font-size: 15px; font-weight: 700; }
.item .box[aria-checked="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.item .body { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.item .t { font-family: var(--jp); font-size: 17px; line-height: 1.4; overflow-wrap: anywhere; }
.item .rd { font-size: 13px; color: var(--muted); }
.item .m { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item.done .t { color: var(--muted); }
.divider { width: 40%; border-top: 1px solid var(--line); margin: 6px 0; }
.exlist { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 520px; text-align: left; margin-top: 6px; }
.ex { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); cursor: default; }
.ex > div { min-width: 0; }
.ex .j { font-family: var(--jp); font-size: 18px; line-height: 2.1; overflow-wrap: anywhere; }
.ex .k { font-size: 13px; color: var(--muted); }
.readings { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; text-align: left; font-size: 15px; }
.readings dt { color: var(--muted); font-size: 12px; padding-top: 3px; }
.readings dd { margin: 0; font-family: var(--jp); font-size: 17px; }
.related { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.related span { font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }

/* quiz */
.qbox { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
.qprompt { text-align: center; padding: 18px 8px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); }
.qprompt .word { font-family: var(--jp); font-size: 40px; font-weight: 600; line-height: 1.3; }
.qprompt .kanji { font-family: var(--jp); font-size: 80px; font-weight: 600; line-height: 1.1; }
.qprompt .sent { font-family: var(--jp); font-size: 21px; line-height: 2.2; text-align: left; overflow-wrap: anywhere; }
.qprompt .ko { font-size: 13px; color: var(--muted); text-align: left; margin-top: 4px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choice { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; text-align: center; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.choice.jpc { font-family: var(--jp); font-size: 18px; }
.choice.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.choice.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.feedback { min-height: 22px; font-size: 14px; text-align: center; }
.feedback.ok { color: var(--ok); } .feedback.bad { color: var(--bad); }

/* grammar */
.glist { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.gitem { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.gitem:hover { border-color: var(--ai); }
.gitem .t { font-family: var(--jp); font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.gitem .m { font-size: 12px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.gitem .s { font-size: 11px; font-weight: 600; color: var(--muted); }
.gitem .s.done { color: var(--ok); }
.gtitle { font-family: var(--jp); font-size: 26px; font-weight: 600; margin: 0; line-height: 1.35; overflow-wrap: anywhere; }
.explain { white-space: pre-line; margin: 0; font-size: 14px; line-height: 1.7; padding: 12px 14px; background: var(--paper); border-radius: 10px; overflow-wrap: anywhere; }
.conn { white-space: pre-line; margin: 0; font-size: 14px; line-height: 1.7; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 10px; font-family: var(--jp); overflow-wrap: anywhere; }
.src { font-size: 11px; color: var(--muted); }
.q { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.q .qt { font-family: var(--jp); font-size: 19px; line-height: 2.2; overflow-wrap: anywhere; }
.q .qk { font-size: 13px; color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-size: 16px; max-width: 100%; overflow-wrap: anywhere; }
.opt.jpc { font-family: var(--jp); }
.opt.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.why { font-size: 13px; color: var(--muted); margin: 0; }

/* writing */
.prompt-ko { font-size: 21px; font-weight: 600; line-height: 1.5; margin: 0; text-wrap: balance; }
.genko {
  width: 100%; height: 168px; resize: vertical; border: 1px solid var(--grid); border-radius: 8px;
  font-family: var(--jp); font-size: 22px; line-height: 40px; letter-spacing: 14px;
  padding: 4px 0 4px 7px; color: var(--ink); background-color: var(--surface);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 36px 40px; background-position: 0 4px; background-attachment: local;
}
.genko::placeholder { letter-spacing: 0; font-family: var(--ko); font-size: 15px; color: var(--muted); }
.result { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--paper); }
.pill { align-self: flex-start; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
.pill.perfect { background: var(--ok-soft); color: var(--ok); }
.pill.good { background: var(--ai-soft); color: var(--ai); }
.pill.fix { background: var(--bad-soft); color: var(--bad); }
.corrected { font-family: var(--jp); font-size: 22px; line-height: 1.6; margin: 0; overflow-wrap: anywhere; }
.reading { font-family: var(--jp); color: var(--muted); margin: 0; overflow-wrap: anywhere; }
.points { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.points li { padding: 10px 12px; background: var(--surface); border-radius: 10px; border: 1px solid var(--line); }
.points .fx { font-family: var(--jp); font-size: 17px; overflow-wrap: anywhere; }
.points .fx s { color: var(--bad); }
.points .fx b { color: var(--ok); font-weight: 600; }
.points .wy { font-size: 13px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.thinking { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ai); animation: pulse 1s infinite ease-in-out; }
@keyframes pulse { 50% { opacity: .25; } }
.foot { font-size: 12px; color: var(--muted); text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; }
@media (prefers-reduced-motion: reduce) { .card.in-l, .card.in-r { animation: none; } .dot { animation: none; } .bar > i { transition: none; } }
@media (max-width: 480px) {
  .card .word { font-size: 38px; }
  .card .kanji, .qprompt .kanji { font-size: 76px; }
  .panel { padding: 16px; }
  .brand h1 { font-size: 26px; }
}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <h1>にほんご<span>연습장</span></h1>
      <p>내 자료로 만든 JLPT 단어·한자·문법·작문</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="levelbar">
    <span class="label">내 급수</span>
    <div class="lv" id="levels" role="group" aria-label="JLPT 급수"></div>
  </div>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="vocab"><span class="k">語</span><span class="l">단어</span></button>
    <button role="tab" data-tab="kanji"><span class="k">漢</span><span class="l">한자</span></button>
    <button role="tab" data-tab="grammar"><span class="k">文</span><span class="l">문법</span></button>
    <button role="tab" data-tab="write"><span class="k">書</span><span class="l">작문</span></button>
  </nav>

  <main id="main"><div class="panel loading">불러오는 중…</div></main>

  <div class="foot">
    <label class="row" style="gap:6px"><input type="checkbox" id="furi"> 후리가나(읽는 법) 표시</label>
    <span id="sync">학습 기록은 이 기기에 저장돼요.</span>
    <span>자료: JLPT 통합덱, 와카메센세 N3·N2·N1 문법</span>
  </div>
</div>

<script>
// ================= Helpers =================
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];

const ROMA = (() => {
  const base = { あ:'a',い:'i',う:'u',え:'e',お:'o',か:'ka',き:'ki',く:'ku',け:'ke',こ:'ko',さ:'sa',し:'shi',す:'su',せ:'se',そ:'so',た:'ta',ち:'chi',つ:'tsu',て:'te',と:'to',な:'na',に:'ni',ぬ:'nu',ね:'ne',の:'no',は:'ha',ひ:'hi',ふ:'fu',へ:'he',ほ:'ho',ま:'ma',み:'mi',む:'mu',め:'me',も:'mo',や:'ya',ゆ:'yu',よ:'yo',ら:'ra',り:'ri',る:'ru',れ:'re',ろ:'ro',わ:'wa',ゐ:'i',ゑ:'e',を:'o',ん:'n',が:'ga',ぎ:'gi',ぐ:'gu',げ:'ge',ご:'go',ざ:'za',じ:'ji',ず:'zu',ぜ:'ze',ぞ:'zo',だ:'da',ぢ:'ji',づ:'zu',で:'de',ど:'do',ば:'ba',び:'bi',ぶ:'bu',べ:'be',ぼ:'bo',ぱ:'pa',ぴ:'pi',ぷ:'pu',ぺ:'pe',ぽ:'po',ゔ:'vu',ぁ:'a',ぃ:'i',ぅ:'u',ぇ:'e',ぉ:'o',ゃ:'ya',ゅ:'yu',ょ:'yo',ゎ:'wa' };
  const two = { きゃ:'kya',きゅ:'kyu',きょ:'kyo',しゃ:'sha',しゅ:'shu',しょ:'sho',ちゃ:'cha',ちゅ:'chu',ちょ:'cho',にゃ:'nya',にゅ:'nyu',にょ:'nyo',ひゃ:'hya',ひゅ:'hyu',ひょ:'hyo',みゃ:'mya',みゅ:'myu',みょ:'myo',りゃ:'rya',りゅ:'ryu',りょ:'ryo',ぎゃ:'gya',ぎゅ:'gyu',ぎょ:'gyo',じゃ:'ja',じゅ:'ju',じょ:'jo',ぢゃ:'ja',ぢゅ:'ju',ぢょ:'jo',びゃ:'bya',びゅ:'byu',びょ:'byo',ぴゃ:'pya',ぴゅ:'pyu',ぴょ:'pyo',
    // 외래어용 (카타카나)
    しぇ:'she',ちぇ:'che',じぇ:'je',ふぁ:'fa',ふぃ:'fi',ふぇ:'fe',ふぉ:'fo',ふゅ:'fyu',てぃ:'ti',でぃ:'di',とぅ:'tu',どぅ:'du',てゅ:'tyu',でゅ:'dyu',うぃ:'wi',うぇ:'we',うぉ:'wo',ゔぁ:'va',ゔぃ:'vi',ゔぇ:'ve',ゔぉ:'vo',つぁ:'tsa',つぃ:'tsi',つぇ:'tse',つぉ:'tso',くぁ:'kwa',ぐぁ:'gwa',いぇ:'ye' };
  const toH = t => t.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  const MAC = { a:'ā', i:'ī', u:'ū', e:'ē', o:'ō' };
  return text => {
    const h = toH(String(text || '')); let out = '', i = 0;
    while (i < h.length) {
      const c = h[i], pair = h.slice(i, i + 2);
      if (c === 'っ' || c === 'ッ') {           // 촉음: 다음 자음 겹치기
        const nx = two[h.slice(i + 1, i + 3)] || base[h[i + 1]] || '';
        out += nx ? (nx.startsWith('ch') ? 't' : nx[0]) : ''; i++; continue;
      }
      if (c === 'ー') {                         // 장음: 앞 모음을 길게
        const m = out.match(/[aiueo]$/); out = m ? out.slice(0, -1) + MAC[m[0]] : out + '-'; i++; continue;
      }
      if (two[pair]) { out += two[pair]; i += 2; continue; }
      if (c === 'ん') { const nx = base[h[i + 1]] || ''; out += /^[aiueoy]/.test(nx) ? "n'" : 'n'; i++; continue; }
      out += base[c] !== undefined ? base[c] : c; i++;
    }
    return out;
  };
})();

const DATA = {};
const loading = {};
function loadLevel(lv) {
  if (DATA[lv]) return Promise.resolve(DATA[lv]);
  if (loading[lv]) return loading[lv];
  const g = lv === 'N5' ? 'N4' : lv;
  // 데이터는 페이지 안에 들어 있어요 (없을 때만 파일에서 불러옴)
  const get = f => {
    const el = document.getElementById('data:' + f);
    if (el) { try { return Promise.resolve(JSON.parse(el.textContent)); } catch (e) {} }
    return fetch('data/' + f).then(r => { if (!r.ok) throw new Error(f); return r.json(); });
  };
  loading[lv] = Promise.all([get(`vocab-${lv}.json`), get(`kanji-${lv}.json`), get(`grammar-${g}.json`)])
    .then(([vocab, kanji, grammar]) => { vocab.forEach((w, i) => { w.n = i + 1; }); kanji.forEach((x, i) => { x.n = i + 1; }); return (DATA[lv] = { vocab, kanji, grammar }); })
    .catch(e => { delete loading[lv]; throw e; });

}

function toPlain(p = prog) {
  const o = { v: 2, level: p.level, days: p.days, gs: p.gs, wc: p.wc };
  for (const m of SETS) { o[m] = {}; for (const lv in p.sets[m]) o[m][lv] = [...p.sets[m][lv]]; }
  return o;
}
function fromPlain(o) {
  const p = { level: LEVELS.includes(o && o.level) ? o.level : 'N4', days: Array.isArray(o && o.days) ? o.days : [], sets: { vk: {}, vh: {}, kk: {}, kh: {}, vs: {}, ks: {}, ws: {} }, gs: {}, wc: {} };
  if (o && o.v === 2) {
    for (const m of SETS) for (const lv in (o[m] || {})) p.sets[m][lv] = new Set(o[m][lv]);
    p.gs = o.gs || {}; p.wc = o.wc || {};
  }
  return p;
}
function merge(a, b) {
  const p = fromPlain({ v: 2, level: a.level || b.level });
  p.days = [...new Set([...(a.days || []), ...(b.days || [])])].sort().slice(-400);
  for (const src of [a, b]) {
    for (const m of SETS) for (const lv in (src[m] || {})) { const s = p.sets[m][lv] || (p.sets[m][lv] = new Set()); for (const x of src[m][lv]) s.add(x); }
    for (const k in (src.gs || {})) p.gs[k] = Math.max(p.gs[k] || 0, src.gs[k]);
    for (const lv in (src.wc || {})) { const c = p.wc[lv] || (p.wc[lv] = { n: 0, perfect: 0 }); c.n = Math.max(c.n, src.wc[lv].n || 0); c.perfect = Math.max(c.perfect, src.wc[lv].perfect || 0); }
  }
  for (const [k, h] of [['vk', 'vh'], ['kk', 'kh']]) for (const lv in p.sets[h]) for (const x of p.sets[h][lv]) if (p.sets[k][lv] && p.sets[k][lv].has(x)) p.sets[h][lv].delete(x);
  return p;
}

}

// ================= Shared quiz builder =================
function choiceQuiz(pool, item, keyOf, optOf, n = 4) {
  const right = optOf(item);
  const seen = new Set([right]);
  const opts = [right];
  for (const x of shuffle(pool)) {
    if (opts.length >= n) break;
    if (keyOf(x) === keyOf(item)) continue;
    const o = optOf(x);
    if (!o || seen.has(o)) continue;
    seen.add(o); opts.push(o);
  }
  const order = shuffle(opts.map((_, i) => i));
  return { opts: order.map(i => opts[i]), ans: order.indexOf(0), picked: null };
}

// ================= Swipe (좌우로 넘기기) =================
// 왼쪽으로 밀면 다음, 오른쪽으로 밀면 이전 카드
function attachSwipe(el, onPrev, onNext) {
  let x0 = null, y0 = 0, dx = 0, id = null, horiz = null;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.closest('.listen, .chk')) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; id = e.pointerId; horiz = null;
  });
  el.addEventListener('pointermove', e => {
    if (x0 === null || e.pointerId !== id) return;
    dx = e.clientX - x0; const dy = e.clientY - y0;
    if (horiz === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      horiz = Math.abs(dx) > Math.abs(dy);
      if (horiz) { try { el.setPointerCapture(id); } catch (_) {} el.classList.add('dragging'); }
    }
    if (horiz) el.style.transform = `translateX(${dx}px) rotate(${dx / 40}deg)`;
  });
  const end = e => {
    if (x0 === null || (e && e.pointerId !== id)) return;
    const wasHoriz = horiz; x0 = null; el.classList.remove('dragging');
    if (!wasHoriz) return;
    el.dataset.dragged = '1'; setTimeout(() => { delete el.dataset.dragged; }, 50);
    const w = el.offsetWidth || 300, go = Math.abs(dx) > Math.min(90, w * .22) ? (dx < 0 ? onNext : onPrev) : null;
    el.classList.add('settle');
    if (go && go.ok !== false && go()) {
      el.style.transform = `translateX(${dx < 0 ? -w : w}px)`; el.style.opacity = '0';
    } else { el.style.transform = ''; }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  // 끌어서 넘긴 직후의 클릭(뒤집기)은 무시
  el.addEventListener('click', e => { if (el.dataset.dragged) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
}

const DAYS = 30;
const dayRange = (n, d) => [Math.floor(n * (d - 1) / DAYS), Math.floor(n * d / DAYS)];

function savedDay(kind) { const v = parseInt(lsGet(dayKey(kind)), 10); return v >= 0 && v <= DAYS ? v : null; }

function firstOpenDay(list, set) {
  for (let d = 1; d <= DAYS; d++) { const [a, b] = dayRange(list.length, d); for (let i = a; i < b; i++) if (!set.has(nk(list[i]))) return d; }
  return 1;
}
function sliceDay(list, d) { if (!d) return list; const [a, b] = dayRange(list.length, d); return list.slice(a, b); }
function planHTML(id, list, set, cur, unit) {
  let grid = '';
  for (let d = 1; d <= DAYS; d++) {
    const [a, b] = dayRange(list.length, d); let c = 0;
    for (let i = a; i < b; i++) if (set.has(nk(list[i]))) c++;
    const t = b - a, st = t && c === t ? 'done' : c ? 'part' : '';
    grid += `<button class="${st}" data-d="${d}" aria-pressed="${cur === d}" aria-label="${d}일차 ${c}/${t}" title="${d}일차 · ${a + 1}~${b}번 · ${c}/${t}" style="--p:${t ? Math.round(c / t * 100) : 0}%">${d}</button>`;
  }
  const doneAll = list.filter(x => set.has(nk(x))).length;
  return `<div class="plan" id="${id}">
    <div class="row spread"><span class="label">30일 계획 · 하루 약 ${Math.round(list.length / DAYS)}${unit} · 전체 ${doneAll}/${list.length}</span><button class="chip" data-d="0" aria-pressed="${cur === 0}">전체 보기</button></div>
    <div class="days">${grid}</div>
  </div>`;
}

  return `${cur ? cur + '일차' : '전체'}${range} · 공부한 ${unit} ${done}/${items.length}`;
}

  const pl = $('#wplan'); if (pl) pl.onclick = e => { const b = e.target.closest('[data-d]'); if (!b || W.busy) return; W.day = +b.dataset.d; rememberDay('w', W.day); W.gid = null; W.cur = null; renderWrite(); };
  const fl = $('#wfilter'); if (fl) fl.onclick = e => { const b = e.target.closest('[data-f]'); if (b) { W.filter = b.dataset.f; renderWrite(); } };
  const nd = $('#wnextday'); if (nd) nd.onclick = () => { W.day = day + 1; rememberDay('w', W.day); W.cur = null; renderWrite(); window.scrollTo({ top: 0 }); };
}
function renderResult() {
  const out = $('#wout'); if (!out) return;
  out.innerHTML = '';
  if (W.busy) { out.innerHTML = '<div class="thinking"><span class="dot"></span>AI 선생님이 읽고 있어요… (10~30초)</div>'; return; }
  if (W.err) { const p = document.createElement('p'); p.className = 'note'; p.style.color = 'var(--bad)'; p.textContent = W.err; out.append(p); return; }
  const r = W.result; if (!r) return;
  const box = document.createElement('div'); box.className = 'result';
  const pill = document.createElement('span'); pill.className = 'pill ' + (VERDICT[r.verdict] ? r.verdict : 'good'); pill.textContent = VERDICT[r.verdict] || '첨삭 결과'; box.append(pill);
  if (r.corrected) {
    const row = document.createElement('div'); row.className = 'ex'; row.style.cssText = 'background:transparent;border:0;padding:0';
    row.insertAdjacentHTML('afterbegin', listenBtn(String(r.reading || r.corrected)));
    const col = document.createElement('div');
    const c = document.createElement('p'); c.className = 'corrected'; c.textContent = r.corrected; col.append(c);
    if (r.reading) { const y = document.createElement('p'); y.className = 'reading'; y.textContent = r.reading; col.append(y); }
    if (r.meaning) { const m = document.createElement('p'); m.className = 'note'; m.textContent = r.meaning; col.append(m); }
    row.append(col); box.append(row);
  }
  if (Array.isArray(r.points) && r.points.length) {
    const ul = document.createElement('ul'); ul.className = 'points';
    for (const pt of r.points.slice(0, 8)) {
      const li = document.createElement('li');
      const fx = document.createElement('div'); fx.className = 'fx';
      const s = document.createElement('s'); s.textContent = pt.wrong || '';
      const b = document.createElement('b'); b.textContent = pt.right || '';
      fx.append(s, document.createTextNode(' → '), b);
      const wy = document.createElement('div'); wy.className = 'wy'; wy.textContent = pt.why || '';
      li.append(fx, wy); ul.append(li);
    }
    box.append(ul);
  }
  if (r.comment) { const cm = document.createElement('p'); cm.style.margin = '0'; cm.textContent = r.comment; box.append(cm); }
  out.append(box);
}
async function checkWriting() {
  const text = ($('#wtext').value || '').trim();
  if (!text) { W.err = '먼저 일본어로 한 문장 써 보세요.'; W.result = null; renderResult(); return; }
  const s = sampleFn !== undefined ? sampleFn : await samplePromise;
  if (!s) { aiOff = true; renderWrite(); return; }
  const lv = prog.level, c = W.cur;
  const task = W.mode === 'prompt' && c
    ? `[과제] 다음 한국어 문장을 일본어로 쓰기: "${c.ko}"\n[연습할 문법] ${c.g.p} (${c.g.wm || c.g.m})\n[참고 모범 답안] ${plain(c.jp)} (다른 자연스러운 표현도 정답으로 인정하세요. 연습할 문법을 쓰지 않았다면 그 점을 짚어 주세요)`
    : `[과제] 자유 작문. 주제: ${TOPICS[lv][W.topic]}`;
  const prompt = `당신은 JLPT ${lv} 수준(${LEVEL_NOTE[lv]})을 공부하는 한국인 학습자를 가르치는 친절한 일본어 선생님입니다.
${task}
[학생 답안]
${text.slice(0, 2000)}

규칙:
- 학생은 히라가나, 가타카나, 한자, 로마자 중 무엇으로 써도 됩니다. 로마자로 썼다면 일본어 문자로 바꿔 보여 주되, 그것만으로 틀렸다고 하지 마세요.
- 한자를 히라가나로 쓴 것도 틀린 것이 아닙니다.
- 설명은 모두 쉬운 한국어로 쓰세요.
- 학습자 수준(${lv})보다 너무 어려운 표현으로 바꾸지 마세요.${lv === 'N2' || lv === 'N1' ? ' 문체(です·ます체 / だ·である체)의 일관성, 어휘 선택의 자연스러움, 더 세련된 표현도 짚어 주세요.' : ''}

JSON 하나로만 답하세요. 형식:
{"verdict":"perfect 또는 good 또는 fix","corrected":"고친 자연스러운 일본어 (자유 작문이면 전체 글)","reading":"corrected의 히라가나 읽기","meaning":"corrected의 한국어 뜻","points":[{"wrong":"틀린 부분","right":"고친 부분","why":"이유 한 문장"}],"comment":"따뜻한 격려 한 문장"}
perfect = 고칠 곳 없음(points는 빈 배열), good = 뜻은 통하지만 더 자연스럽게 바꿀 곳이 있음, fix = 틀린 곳이 있음.`;
  W.busy = true; W.err = ''; W.result = null; W.ctl = new AbortController();
  renderWrite();
  try {
    const r = await s.json(prompt, { signal: W.ctl.signal });
    W.result = (r && typeof r === 'object') ? r : null;
    if (!W.result) W.err = ERR.invalid_json;
    else {
      const wc = prog.wc[lv] || (prog.wc[lv] = { n: 0, perfect: 0 });
      wc.n++; if (r.verdict === 'perfect') wc.perfect++;
      if (W.mode === 'prompt' && c && c.n) S('ws').add(nk(c));
      studied(); save(); renderStats();
    }
  } catch (e) {
    const code = e && e.code;
    if (code === 'cancelled') W.err = '';
    else if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) { aiOff = true; W.err = ERR[code] || ERR.not_granted; }
    else W.err = ERR[code] || '연결이 끊겼어요. 잠시 후 다시 눌러 주세요.';
  }
  W.busy = false; W.ctl = null;
  if (tab === 'write') renderWrite();
}

// ================= Boot =================
renderLevels();
renderStats();
showView();
LEVELS.forEach(lv => { if (lv !== prog.level) setTimeout(() => loadLevel(lv).catch(() => {}), 2500); }); // warm other levels for related-word lookups

(async () => {
  if (!(window.claude && window.claude.use)) return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc('data/users/' + id + '/progress');
    const snap = await ref.get();
    const local = toPlain();
    const remote = snap.exists ? (snap.data() || {}) : null;
    const levelBefore = prog.level;
    prog = remote ? merge(remote.v === 2 ? remote : { level: remote.level, days: remote.days }, local) : prog;
    dbRef = ref;
    $('#sync').textContent = '학습 기록이 내 계정에 저장돼요. 휴대폰과 PC에서 이어서 할 수 있어요.';
    lsSet(LS_KEY, JSON.stringify(toPlain()));
    if (!remote || JSON.stringify(remote) !== JSON.stringify(toPlain())) { dirty = true; flush(); }
    if (prog.level !== levelBefore) resetViews();
    renderLevels(); renderStats();
    if (!W.busy) showView();
  } catch (e) { /* device-only storage */ }
})();
</script>
