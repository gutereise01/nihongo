<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f8ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="영단어30일">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>영단어 30일</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,700;1,8..60,400&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: 한 손 모바일 단어장. OMR 답안지 마킹을 진도표로, 카드 한 장씩 스와이프. */
:root{
  --paper:#f4f8ff; --sheet:#ffffff; --ink:#1f2a3d; --muted:#6b7689; --line:#dfe7f3; color-scheme:light;
  --omr:#2f6fe4; --omr-soft:#e3edff; --know:#2f9e63; --know-soft:#e2f6ea; --again:#d08a2e; --again-soft:#fdf1e0;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-word:"Source Serif 4",Georgia,"Times New Roman",serif;
  --shadow:0 8px 24px rgba(47,111,228,.12),0 2px 6px rgba(20,40,80,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0}
.app{max-width:480px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column}
.brand small{font-size:11px;letter-spacing:.12em;color:var(--omr);font-weight:600}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.iconbtn{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid var(--omr);border-radius:12px;overflow:hidden}
.tabs button{border:0;background:transparent;padding:9px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;border-left:1px solid var(--omr-soft)}
.tabs button:first-child{border-left:0}
.tabs b{font-size:17px;letter-spacing:.02em}
.tabs span{font-size:10.5px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--omr);color:#fff}
.tabs button[aria-selected="true"] span{color:rgba(255,255,255,.85)}
.summary{display:flex;flex-direction:column;gap:10px}
.sumrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sumrow h2{margin:0;font-size:17px;font-weight:600}
.sumrow .count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.sumrow .count b{color:var(--ink);font-size:20px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--omr);width:0;transition:width .3s}
.today{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.today p{margin:0;font-size:13px;color:var(--muted)}
.today strong{display:block;font-size:16px;color:var(--ink)}
.primary{border:0;background:var(--omr);color:#fff;border-radius:12px;padding:11px 16px;font-weight:600;white-space:nowrap}
.primary:disabled{opacity:.4;cursor:default}
.ghost{border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:11px 16px;font-weight:500}
.omr{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 12px 16px}
.omr-head{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;color:var(--omr);font-weight:600;padding:0 4px 10px;border-bottom:1px dashed var(--omr-soft);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px 6px}
.day{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px}
.bub{--p:0;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--omr);
  background:conic-gradient(var(--omr) calc(var(--p)*1%),transparent 0);position:relative}
.bub::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--omr)}
.bub span{position:relative}
.day.full .bub::before{background:var(--omr)}
.day.full .bub span{color:#fff}
.day.empty{opacity:.35}
.day small{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);background:var(--omr-soft);border-radius:10px;padding:10px 12px;margin:0}
/* day sheet */
.sheet{display:flex;flex-direction:column;gap:14px}
.back{border:0;background:transparent;color:var(--muted);padding:4px 0;align-self:flex-start;font-size:14px}
.sheet h2{margin:0;font-size:20px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions>*{flex:1 1 140px}
.list{list-style:none;margin:0;padding:0;background:var(--sheet);border:1px solid var(--line);border-radius:14px}
.list li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.chk{width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:1.5px solid var(--omr);background:transparent;padding:0;display:grid;place-items:center;color:#fff;font-size:13px}
.chk[aria-pressed="true"]{background:var(--omr)}
.lw{min-width:0;flex:1}
.lw b{font-family:var(--f-word);font-size:17px;font-weight:600}
.lw p{margin:0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
/* study */
.study{display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - 60px)}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shead .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stack{position:relative;height:470px;touch-action:pan-y}
.card{position:absolute;inset:0;background:var(--sheet);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px 22px;display:flex;flex-direction:column;gap:14px;user-select:none;-webkit-user-select:none;touch-action:pan-y;will-change:transform}
.card.under{transform:scale(.95) translateY(14px);opacity:.6;box-shadow:none}
.card.anim{transition:transform .22s ease,opacity .22s}
.lvchip{align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--omr);border:1px solid var(--omr);border-radius:20px;padding:2px 9px}
.word{font-family:var(--f-word);font-size:clamp(30px,9vw,42px);font-weight:700;line-height:1.1;letter-spacing:-.01em;margin:6px 0 0;overflow-wrap:anywhere;text-wrap:balance}
.pron{display:flex;align-items:center;gap:10px;color:var(--muted);font-family:var(--f-word);font-style:italic;font-size:17px}
.speak{border:1px solid var(--line);background:var(--paper);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-style:normal;padding:0}
.speak svg{width:18px;height:18px;fill:var(--ink)}
.reveal{margin-top:auto;display:flex;flex-direction:column;gap:12px;border-top:1px dashed var(--line);padding-top:16px}
.meaning{font-size:19px;font-weight:600}
.ex{font-family:var(--f-word);font-size:16px;line-height:1.45;margin:0}
.ex mark{background:var(--omr-soft);color:inherit;padding:0 2px;border-radius:3px}
.exko{font-size:13.5px;color:var(--muted);margin:0}
.hint{margin-top:auto;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:12px;padding:18px}
.stamp{position:absolute;top:22px;font-weight:700;font-size:18px;border:2.5px solid;border-radius:8px;padding:2px 10px;opacity:0;pointer-events:none}
.stamp.k{right:20px;color:var(--know);transform:rotate(8deg)}
.stamp.a{left:20px;color:var(--again);transform:rotate(-8deg)}
.swipebtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swipebtns button{border-radius:14px;padding:13px;font-weight:600;border:0}
.btn-again{background:var(--again-soft);color:var(--again)}
.btn-know{background:var(--know-soft);color:var(--know)}
.tip{text-align:center;font-size:12px;color:var(--muted);margin:0}
.result{background:var(--sheet);border:1px solid var(--line);border-radius:20px;padding:28px 22px;display:flex;flex-direction:column;gap:14px;text-align:center}
.result h2{margin:0;font-size:22px}
.stats{display:flex;justify-content:center;gap:28px;font-variant-numeric:tabular-nums}
.stats b{display:block;font-size:26px}
.stats span{font-size:12px;color:var(--muted)}
/* import */
.imp textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink);padding:12px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.imp code{font-size:12px;background:var(--omr-soft);border-radius:4px;padding:1px 5px;overflow-wrap:anywhere}
.imp p{margin:0;font-size:13.5px;color:var(--muted)}
.msg{font-size:13.5px;border-radius:10px;padding:10px 12px;margin:0}
.msg.ok{background:var(--know-soft);color:var(--know)}
.msg.err{background:var(--again-soft);color:var(--again)}
.danger{border:1px solid var(--omr);color:var(--omr);background:transparent;border-radius:12px;padding:11px 16px;font-weight:600}
.file{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.card.anim,.bar i{transition:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip2{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.def{font-size:13.5px;color:var(--muted);margin:0;font-style:italic;font-family:var(--f-word)}
.reveal{overflow-y:auto}
.settings{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.settings p{margin:0;font-size:12.5px;color:var(--muted)}
.lw .pos{font-size:11px;color:var(--muted);margin-left:6px;font-family:var(--f-ui);font-weight:400}
.lw{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.list li .go{color:var(--muted);font-size:20px;line-height:1}
.list li:has(.lw:active){background:var(--omr-soft)}
/* centered, large meaning + example */
.stack{height:min(560px,calc(100vh - 230px));min-height:440px}
.card{align-items:center;text-align:center;padding:22px 20px}
.card .chips{justify-content:center}
.card .word{margin-top:4px}
.card .pron{justify-content:center}
.card .reveal{margin:auto 0;width:100%;border-top:0;padding-top:0;gap:14px;align-items:center;justify-content:center;overflow-y:auto}
.card .meaning{font-size:clamp(22px,6.5vw,28px);font-weight:700;color:var(--omr);line-height:1.3}
.card .ex{font-size:clamp(16px,4.5vw,19px);line-height:1.5;max-width:30ch}
.card .def{font-size:clamp(21px,6.2vw,27px);line-height:1.35;color:var(--ink);font-style:normal;font-weight:500;max-width:28ch}
.dw{cursor:pointer;border-bottom:1.5px dotted var(--omr);padding-bottom:1px}
.dw:active{background:var(--omr-soft)}
.peek{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(448px,calc(100% - 32px));background:var(--sheet);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;z-index:20;display:flex;flex-direction:column;gap:6px}
.peek-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.peek-top b{font-family:var(--f-word);font-size:22px}
.peek-top span{font-size:12px;color:var(--muted)}
.peek-x{border:0;background:var(--paper);border-radius:50%;width:32px;height:32px;color:var(--muted)}
.peek-ko{font-size:18px;font-weight:700;color:var(--omr)}
.peek-def{margin:0;font-size:14px;color:var(--muted)}
.vsel{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink);font:inherit;font-size:15px}
/* home: collapsible day + inline card */
.homewrap{display:flex;flex-direction:column;gap:12px}
.daybar{display:flex;gap:8px;align-items:stretch}
.daytoggle{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--sheet);border-radius:14px;padding:10px 14px;text-align:left}
.daytoggle .dl{display:flex;flex-direction:column;min-width:0}
.daytoggle .dl b{font-size:17px}
.daytoggle .dl small{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.daytoggle .chev{font-size:13px;color:var(--omr);font-weight:600;white-space:nowrap}
.listbtn{border:1px solid var(--omr);background:var(--sheet);color:var(--omr);border-radius:14px;padding:0 14px;font-weight:600;font-size:14px;white-space:nowrap}
.bar.thin{height:4px}
.omr-foot{margin:12px 4px 0;font-size:12px;color:var(--muted)}
.day.cur .bub::before{box-shadow:0 0 0 3px var(--omr-soft)}
.day.cur small{color:var(--omr);font-weight:700}
.homewrap .stack{height:calc(100vh - 330px);min-height:400px;max-height:600px}
.navbtns{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.navb{border:1px solid var(--line);background:var(--sheet);border-radius:14px;padding:13px 6px;font-weight:600;color:var(--ink)}
.navb:disabled{opacity:.35}
.navbtns .btn-know{border-radius:14px;padding:13px;font-weight:700;border:1.5px solid var(--know);background:var(--sheet);color:var(--know)}
.navbtns .btn-know.on{background:var(--know);color:#fff}
.kchip{position:absolute;top:16px;right:16px;font-size:12px;font-weight:700;color:#fff;background:var(--know);border-radius:20px;padding:3px 10px;display:none}
.card.known .kchip{display:block}
.card.known{border-color:var(--know)}
.list li.here{background:var(--omr-soft)}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:8px 16px;border-radius:20px;font-size:14px;font-weight:600;z-index:30}
</style>
</head>
<body>

<div class="app" id="app">
  <section id="home">
    <div class="homewrap">
      <header class="top">
        <div class="brand"><small>CEFR 레벨 · 30일 완성</small><h1>영단어 30일</h1></div>
        <button class="iconbtn" id="toSettings">설정</button>
      </header>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="daybar">
        <button class="daytoggle" id="dayToggle" aria-expanded="false" aria-controls="omrPanel">
          <span class="dl"><b id="dayLabel">DAY 1</b><small id="daySub"></small></span>
          <span class="chev" id="chev">펼치기 ▾</span>
        </button>
        <button class="listbtn" id="toList">목록 보기</button>
      </div>
      <div class="bar thin"><i id="dayBar"></i></div>
      <div class="omr" id="omrPanel" hidden>
        <div class="omr-head"><span id="lvName"></span><span id="omrDone"></span></div>
        <div class="grid" id="grid"></div>
        <p class="omr-foot"><span id="lvDone">0</span> / <span id="lvTotal">0</span> 단어 외움 · 날짜를 누르면 그날 카드로 이동해요</p>
      </div>
      <div class="stack" id="stack"></div>
      <div class="navbtns">
        <button class="navb" id="prevBtn" aria-label="이전 단어">‹ 이전</button>
        <button class="btn-know" id="knowBtn">외웠어요</button>
        <button class="navb" id="nextBtn" aria-label="다음 단어">다음 ›</button>
      </div>
      <p class="tip" id="tip">왼쪽으로 밀면 다음, 오른쪽으로 밀면 이전 단어예요. 순서는 바뀌지 않아요.</p>
      <div class="peek" id="peek" hidden>
        <div class="peek-top"><div><b id="pkW"></b> <span id="pkP"></span></div><button class="peek-x" id="pkX" aria-label="닫기">✕</button></div>
        <div class="peek-ko" id="pkK"></div>
        <p class="peek-def" id="pkD"></p>
      </div>
    </div>
  </section>

  <section id="dayView" hidden>
    <div class="sheet">
      <button class="back" data-go="home">← 카드로</button>
      <div class="sumrow"><h2 id="dayTitle"></h2><div class="count"><b id="dayDone">0</b> / <span id="dayTotal">0</span></div></div>
      <div class="bar"><i id="dayBar2"></i></div>
      <ul class="list" id="dayList"></ul>
    </div>
  </section>

  <section id="settingsView" hidden>
    <div class="sheet">
      <button class="back" data-go="home">← 카드로</button>
      <h2>설정</h2>
      <div class="settings">
        <p>발음 음성</p>
        <div class="actions">
          <button class="ghost" id="recOn">자연 음성 (녹음)</button>
          <button class="ghost" id="recOff">아이폰 음성</button>
        </div>
        <div class="actions"><button class="ghost" id="voiceTest">들어보기</button></div>
        <p>자연 음성은 단어마다 미리 녹음해 둔 발음이에요. 단어장에 없는 단어(정의 속 변형된 단어 등)는 아래에서 고른 아이폰 음성으로 읽어요.</p>
        <select id="voiceSel" class="vsel" aria-label="아이폰 음성 선택"></select>
      </div>
      <div class="settings">
        <p>카드가 넘어갈 때 단어 발음</p>
        <div class="actions">
          <button class="ghost" id="spOn">자동으로 읽기</button>
          <button class="ghost" id="spOff">읽지 않기</button>
        </div>
      </div>
      <div class="settings">
        <p>진도 기록은 이 기기의 브라우저에 저장돼요. 레벨별로 또는 전체를 지울 수 있어요.</p>
        <div class="actions">
          <button class="danger" id="resetLv">현재 레벨 진도 지우기</button>
          <button class="danger" id="resetAll">전체 진도 지우기</button>
        </div>
        <p class="msg ok" id="setMsg" hidden></p>
      </div>
    </div>
  </section>
</div>

  for(const k of c)if(LOOK[k])return LOOK[k];return null}
function linkDef(s){return String(s).split(/(\s+)/).map(p=>{if(/^\s+$/.test(p)||!p)return p;
  const m=p.match(/^([^A-Za-z]*)([A-Za-z][A-Za-z'’-]*)([^A-Za-z]*)$/);if(!m)return esc(p);
  return esc(m[1])+`<span class="dw" data-w="${esc(m[2])}">${esc(m[2])}</span>`+esc(m[3])}).join("")}
function peek(t){const w=lookup(t);if(w&&w.w.toLowerCase()===t.toLowerCase())playWord(w);else speak(t);
  $("pkW").textContent=w?w.w:t;$("pkP").textContent=w?`${w.p} · ${w.lv}`:"";
  $("pkK").textContent=w?(w.ko||""):"이 단어장에는 없는 단어예요";$("pkD").textContent=w?w.def:"";$("peek").hidden=false}
$("pkX").onclick=()=>{$("peek").hidden=true};
document.addEventListener("pointerdown",e=>{const d=e.target.closest&&e.target.closest(".dw");if(d){e.stopPropagation();e.preventDefault();peek(d.dataset.w)}},true);
function highlight(ex,word){
  const toks=word.replace(/\(.*?\)/g," ").split(/[\s\/]+/).filter(t=>t.length>1&&!/^(a|an|the|to|of|be|one's|someone|something|sb|sth)$/i.test(t));
  const base=(toks.sort((a,b)=>b.length-a.length)[0]||word).replace(/[^A-Za-z'-]/g,"");
  let h=esc(ex);if(base.length<2)return h;
  const stem=base.length>4?base.slice(0,base.length-(base.endsWith("e")||base.endsWith("y")?1:0)):base;
  const re=new RegExp("\\b("+stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[a-z]*)","i");
  return h.replace(re,"<mark>$1</mark>");
}
const canSpeak=true;
let useRec=store.get("wl_rec");if(useRec===null)useRec=true;
let AC=null;const AUD={},BUF={},LOADING={};
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}return AC}
function unlock(){const c=ac();if(!c)return;try{if(c.state!=="running")c.resume();const s=c.createBuffer(1,1,22050),n=c.createBufferSource();n.buffer=s;n.connect(c.destination);n.start(0)}catch(e){}}
document.addEventListener("pointerdown",unlock,{capture:true});document.addEventListener("touchend",unlock,{capture:true});
function loadLevel(lv){if(AUD[lv])return Promise.resolve(AUD[lv]);if(LOADING[lv])return LOADING[lv];
  return LOADING[lv]=fetch(`audio/audio-${lv}.json`).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>AUD[lv]=j).catch(()=>{LOADING[lv]=null;return null})}
function b64buf(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
function decode(c,ab){return new Promise((res,rej)=>{const p=c.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej)})}
let curSrc=null;
function playWord(w){if(!w)return;if(!useRec){speak(w.w);return}
  const c=ac();if(!c){speak(w.w);return}
  const go=buf=>{try{if(curSrc)curSrc.stop()}catch(e){}try{speechSynthesis.cancel()}catch(e){}const n=c.createBufferSource();n.buffer=buf;n.connect(c.destination);n.start(0);curSrc=n};
  if(BUF[w.id]){go(BUF[w.id]);return}
  loadLevel(w.lv).then(m=>{if(!m||!m[w.id]){speak(w.w);return}return decode(c,b64buf(m[w.id])).then(buf=>{BUF[w.id]=buf;go(buf)})}).catch(()=>speak(w.w))}
let VOICES=[],voiceName=store.get("wl_voice")||"";
function voiceScore(v){const n=v.name.toLowerCase();let s=0;
  if(/premium/.test(n))s+=100;if(/enhanced|natural|neural/.test(n))s+=60;
  if(/^(ava|zoe|samantha|allison|evan|nathan|joelle|noelle|susan|tom|serena|daniel|karen|moira|google us english|google uk english female)/.test(n))s+=20;
  if(v.lang==="en-US"||v.lang==="en_US")s+=10;else if(/^en/.test(v.lang))s+=4;
  if(/compact|eloquence|grandma|grandpa|bubbles|bad news|bells|boing|cellos|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|fred|junior|ralph|kathy|rocko|shelley|flo|reed|sandy/.test(n))s-=80;
  return s}
function loadVoices(){try{VOICES=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));renderVoiceSel()}catch(e){}}
function pickVoice(){return VOICES.find(v=>v.name===voiceName)||VOICES[0]||null}
if(canSpeak){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}
function speak(t){if(!("speechSynthesis" in window))return;try{const u=new SpeechSynthesisUtterance(t.replace(/\(.*?\)/g,"").replace(/\//g," or "));const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang="en-US";u.rate=.92;u.pitch=1;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function renderVoiceSel(){const s=$("voiceSel");if(!s)return;const cur=pickVoice();
  s.innerHTML=VOICES.length?VOICES.map(v=>`<option value="${esc(v.name)}" ${cur&&v.name===cur.name?"selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join(""):'<option>사용 가능한 영어 음성이 없어요</option>'}
const spk=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>`;
function cardHTML(w,under){
  return `<div class="card ${under?"under":""}">
    <div class="chips"><span class="lvchip">${w.lv}</span><span class="chip2">${esc(w.t||"")}</span><span class="chip2">${esc(w.p)}</span></div>
    <div class="kchip">✓ 외움</div>
    <h2 class="word">${esc(w.w)}</h2>
    <div class="pron"><span>${esc(w.ipa)}</span>${canSpeak?`<button class="speak" aria-label="발음 듣기">${spk}</button>`:""}</div>
    ${under?"":`<div class="reveal" data-rev>
      ${w.ko?`<div class="meaning">${esc(w.ko)}</div>`:""}
      <p class="def">${linkDef(w.def)}</p>
      ${w.ex?`<p class="ex">${highlight(w.ex,w.w)}</p>`:""}
    </div>`}
  </div>`;
}
function curWord(){return daysOf(level)[curDay][idx]}
function renderCard(dir){
  const stack=$("stack"),w=curWord();$("peek").hidden=true;
  stack.innerHTML=cardHTML(w,false);
  const card=stack.lastElementChild,sp=card.querySelector(".speak");
  if(done[w.id])card.classList.add("known");
  if(dir&&!matchMedia("(prefers-reduced-motion: reduce)").matches){card.style.transform=`translateX(${dir*60}%)`;card.style.opacity="0";
    requestAnimationFrame(()=>{card.classList.add("anim");card.style.transform="";card.style.opacity=""})}
  if(sp){sp.addEventListener("pointerdown",e=>{unlock();e.stopPropagation()});sp.onclick=e=>{e.stopPropagation();playWord(w)}}
  bindSwipe(card);
  const kb=$("knowBtn");kb.textContent=done[w.id]?"✓ 외웠어요":"외웠어요";kb.classList.toggle("on",!!done[w.id]);
  const d=daysOf(level);$("prevBtn").disabled=curDay===0&&idx===0;$("nextBtn").disabled=curDay===29&&idx===d[29].length-1;
  if(dir&&autoSpeak)playWord(w);
}
function move(step){
  const d=daysOf(level);let nd=curDay,ni=idx+step;
  if(ni>=d[nd].length){if(nd===29)return;nd++;ni=0}
  if(ni<0){if(nd===0)return;nd--;ni=d[nd].length-1}
  const card=$("stack").lastElementChild;
  const finish=()=>{const dayChanged=nd!==curDay;curDay=nd;idx=ni;savePos();renderDayBar();renderCard(step>0?1:-1);if(dayChanged)toast(`DAY ${curDay+1} 시작`)};
  if(card&&!matchMedia("(prefers-reduced-motion: reduce)").matches){card.classList.add("anim");card.style.transform=`translateX(${step>0?-110:110}%)`;card.style.opacity="0";setTimeout(finish,170)}else finish();
}
function toggleKnow(){const w=curWord();if(done[w.id]){delete done[w.id];save();renderDayBar();renderCard(0)}
  else{done[w.id]=1;save();renderDayBar();const c=$("stack").lastElementChild;if(c)c.classList.add("known");const kb=$("knowBtn");kb.textContent="✓ 외웠어요";kb.classList.add("on");setTimeout(()=>move(1),260)}}
let toastT;function toast(t){let el=$("toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,1400)}
function toggleReveal(){playWord(curWord())}
function bindSwipe(card){
  let sx=0,sy=0,dx=0,drag=false,moved=false,horiz=null;
  card.addEventListener("pointerdown",e=>{drag=true;moved=false;horiz=null;sx=e.clientX;sy=e.clientY;dx=0;card.classList.remove("anim");try{card.setPointerCapture(e.pointerId)}catch(_){}});
  card.addEventListener("pointermove",e=>{if(!drag)return;dx=e.clientX-sx;const dy=e.clientY-sy;
    if(Math.abs(dx)>6||Math.abs(dy)>6)moved=true;if(horiz===null&&moved)horiz=Math.abs(dx)>Math.abs(dy);
    if(horiz)card.style.transform=`translateX(${dx}px)`});
  const end=()=>{if(!drag)return;drag=false;
    if(horiz&&dx<-70)move(1);else if(horiz&&dx>70)move(-1);
    else{card.classList.add("anim");card.style.transform="";if(!moved)toggleReveal()}};
  card.addEventListener("pointerup",end);card.addEventListener("pointercancel",()=>{moved=true;dx=0;end()});
}
$("prevBtn").onclick=()=>move(-1);
$("nextBtn").onclick=()=>move(1);
$("knowBtn").onclick=()=>toggleKnow();
document.addEventListener("keydown",e=>{if($("home").hidden)return;
  if(e.key==="ArrowRight")move(1);else if(e.key==="ArrowLeft")move(-1);
  else if(e.key===" "){e.preventDefault();toggleReveal()}else if(e.key==="Enter")toggleKnow()});

$("voiceSel").onchange=e=>{voiceName=e.target.value;store.set("wl_voice",voiceName);speak("Hello, nice to meet you.")};
function setRec(){$("recOn").className=useRec?"primary":"ghost";$("recOff").className=useRec?"ghost":"primary"}
$("recOn").onclick=()=>{useRec=true;store.set("wl_rec",true);setRec();playWord(W[0])};
$("recOff").onclick=()=>{useRec=false;store.set("wl_rec",false);setRec();speak("Hello")};
$("voiceTest").onclick=()=>{const w=W.find(x=>x.w==="delicious")||W[0];playWord(w)};
function setSp(){$("spOn").className=autoSpeak?"primary":"ghost";$("spOff").className=autoSpeak?"ghost":"primary"}
$("spOn").onclick=()=>{autoSpeak=true;store.set("wl_autospeak",true);setSp()};
$("spOff").onclick=()=>{autoSpeak=false;store.set("wl_autospeak",false);setSp()};
function twoStep(btn,label,fn){let armed=false,t;btn.onclick=()=>{if(!armed){armed=true;btn.textContent="한 번 더 누르면 지워요";t=setTimeout(()=>{armed=false;btn.textContent=label},3000)}else{clearTimeout(t);armed=false;btn.textContent=label;fn()}}}
const setMsg=t=>{$("setMsg").hidden=false;$("setMsg").textContent=t};
twoStep($("resetLv"),"현재 레벨 진도 지우기",()=>{byLv[level].forEach(w=>delete done[w.id]);save();delete POS[level];store.set("wl_pos",POS);initPos();setMsg(`${level} 진도를 지웠어요.`)});
twoStep($("resetAll"),"전체 진도 지우기",()=>{done={};store.del("wl_done");POS={};store.del("wl_pos");initPos();setMsg("전체 진도를 지웠어요.")});
$("toSettings").onclick=()=>{$("setMsg").hidden=true;setSp();setRec();loadVoices();show("settingsView")};
initPos();
renderHome();
loadLevel(level);
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}</script>
